<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaGen — Générateur NovaTour</title>
<style>
:root{--b1:#345C95;--b2:#2B899D;--b3:#125C68;--ink:#16202e;--mu:#667386;--line:#dfe6ee;--bg:#f2f6fa}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:linear-gradient(120deg,var(--b1),var(--b2) 60%,var(--b3));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}
header b{font-size:20px;letter-spacing:.02em}header .sub{opacity:.8;font-size:13px}#sw{margin-left:auto;position:relative;width:min(440px,100%)}#sw input{margin:0;border:0;background:rgba(255,255,255,.95);border-radius:30px;padding:10px 16px}#qr{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden;display:none;z-index:40}#qr.on{display:block}#qr div{padding:11px 16px;cursor:pointer;font-size:14px;color:var(--ink);display:flex;gap:10px;align-items:center}#qr div:hover,#qr div.sel{background:#e4f1f4}#qr small{color:var(--mu)}@media(max-width:700px){header{flex-wrap:wrap}header .sub{display:none}#sw{margin-left:0;flex:1}}
.app{display:grid;grid-template-columns:260px 1fr;gap:18px;max-width:1280px;margin:0 auto;padding:18px}
aside{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;align-self:start;position:sticky;top:12px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:4px 4px 10px}
.pj{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.pj:hover{background:var(--bg)}.pj.on{background:#e4f1f4;color:var(--b3)}.pj small{display:block;color:var(--mu);font-weight:400;font-size:11.5px}
.pj img{width:48px;height:48px;flex:none;padding:5px;border-radius:12px;object-fit:contain;background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.15)}.pj{gap:12px}
.pj .x{margin-left:auto;opacity:0;border:0;background:none;cursor:pointer;color:var(--mu);font-size:16px}.pj:hover .x{opacity:1}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.card h2{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.card h2 i{font-style:normal;background:var(--b2);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.hint{color:var(--mu);font-size:13px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:12px}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:500 14px inherit;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b2)}
input[type=color]{padding:2px;height:40px;cursor:pointer}
textarea{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
button.b{background:var(--b2);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:700 14px inherit;font-family:inherit;cursor:pointer;transition:.15s}
button.b:hover{filter:brightness(1.08)}button.b:disabled{opacity:.5;cursor:wait}button.b.o{background:#fff;color:var(--b1);border:1.5px solid var(--b1)}button.b.s{padding:7px 12px;font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#chat{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.cm{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;max-width:88%}.cm.u{align-self:flex-end;background:var(--b2);color:#fff}.cm.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
#msg{font-size:13.5px;margin-top:12px;padding:10px 14px;border-radius:10px;display:none}#msg.on{display:block}#msg.i{background:#e8f1fb;color:#1c4a85}#msg.e{background:#fdecea;color:#a1271b}#msg.k{background:#e7f6ec;color:#1b6b37}
.notes{background:#fff7e0;border:1px solid #f0d98a;border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:14px;color:#6a5200}.notes b{display:block;margin-bottom:4px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.ph div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg)}.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;background:rgba(0,0,0,.6);color:#fff}.ph .d{right:4px}.ph .f{left:4px}.ph .f.on{background:#f2b632;color:#000}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mu);font-size:13px;cursor:pointer}.drop.h{border-color:var(--b2);background:#e4f1f4}
.logo{display:flex;align-items:center;gap:14px}.logo img{height:64px;max-width:180px;padding:6px;object-fit:contain;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.out{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.o{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}.o b{font-size:15px}.o small{color:var(--mu);font-size:12px}
#modal{position:fixed;inset:0;background:rgba(10,18,30,.7);display:none;z-index:50;align-items:center;justify-content:center;padding:18px}#modal.on{display:flex}
#modal .box{background:#fff;border-radius:16px;width:min(1000px,100%);height:min(86vh,800px);display:flex;flex-direction:column;overflow:hidden}
#modal .bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}#modal .bar b{flex:1}
#modal iframe{flex:1;border:0;width:100%}.bt{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;background:#d9dde3}.bt img{width:100%}
.ni{padding:9px 0;border-top:1px solid #f0d98a}.ni .nt{font-size:13px;line-height:1.5}.nb{display:flex;gap:6px;margin-top:6px}.nb button{border:1.5px solid #d9c27a;background:#fff;border-radius:8px;padding:4px 12px;font:700 12px inherit;font-family:inherit;cursor:pointer}.nb .ok.on{background:#1b9a4b;border-color:#1b9a4b;color:#fff}.nb .ko.on{background:#c23a2b;border-color:#c23a2b;color:#fff}.nc{margin-top:6px!important;padding:7px 10px!important;font-size:13px!important}
.bd{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;margin-left:4px}.bd.n{background:#eef1f5;color:var(--mu)}.bd.ok{background:#e7f6ec;color:#1b6b37}.bd.mod{background:#fff1d6;color:#8a5a00}.vs{font-size:11px;line-height:1.4;margin:-4px 0 0}.pl{font-size:12px;line-height:1.5}.pl a{color:var(--b1)}
.empty{padding:50px 20px;text-align:center;color:var(--mu)}

/* ---- refonte présentation : onglets, en-tête de fiche, assistant flottant, pages en lignes ---- */
:root{--bg:#f4f7fa}body{background:linear-gradient(180deg,#eaf1f6 0,var(--bg) 220px)}
header{padding:12px 24px;box-shadow:0 2px 14px rgba(18,92,104,.25)}
.card{border-radius:20px;border-color:#e3eaf1;box-shadow:0 4px 18px rgba(30,60,90,.05);padding:22px 24px}.card h2 i{display:none}.card h2{font-size:17px}
main[data-tab] .card[data-t]:not([data-t="dock"]),main[data-tab] .nx{display:none}main[data-tab="infos"][id] .card[data-t="infos"],main[data-tab="style"][id] .card[data-t="style"],main[data-tab="medias"][id] .card[data-t="medias"],main[data-tab="pages"][id] .card[data-t="pages"]{display:block}
.ph0{background:#fff;border:1px solid #e3eaf1;border-radius:20px;padding:16px 20px 0;box-shadow:0 4px 18px rgba(30,60,90,.05);position:sticky;top:8px;z-index:15}
.ph0t{display:flex;align-items:center;gap:14px}.ph0t img{width:56px;height:56px;border-radius:50%;object-fit:contain;padding:5px;box-shadow:0 2px 8px rgba(0,0,0,.18)}.ph0t h1{font-size:21px;line-height:1.15}.ph0t small{color:var(--mu);font-size:13px}
.chips0{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:#eef1f5;color:var(--mu)}.chip.ok{background:#e4f5ea;color:#1b6b37}
.tabs0{display:flex;gap:4px;margin-top:10px;overflow-x:auto}.tabs0 button{flex:1;min-width:max-content;border:0;background:none;padding:13px 16px;font:700 14px inherit;font-family:inherit;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:7px}
.tabs0 button i{font-style:normal;background:#e3eaf1;color:var(--mu);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}.tabs0 button.on{color:var(--b3);border-color:var(--b2)}.tabs0 button.on i{background:var(--b2);color:#fff}.tabs0 button:hover{color:var(--b3)}
.nx{display:flex;justify-content:flex-start;margin-bottom:90px}main{padding-bottom:90px}.nx .b{margin-right:auto}main[data-tab="infos"] .nx[data-t="infos"],main[data-tab="style"] .nx[data-t="style"],main[data-tab="medias"] .nx[data-t="medias"]{display:flex}.nx .b{padding:13px 22px;font-size:15px;border-radius:30px;box-shadow:0 8px 20px rgba(43,137,157,.35)}
.dock{position:fixed;right:20px;bottom:20px;width:min(400px,calc(100vw - 40px));z-index:30;box-shadow:0 18px 50px rgba(18,40,70,.28);max-height:78vh;overflow:auto;padding:14px 18px}.dock h2{cursor:pointer;margin:0}.dock.min>*:not(h2){display:none}.dock.min{width:auto;border-radius:30px;padding:12px 20px;background:var(--b2);border:0}.dock.min h2{color:#fff;font-size:15px}
.out{grid-template-columns:1fr;gap:10px}.o{padding:14px 18px;gap:8px;border-radius:16px}.oh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.oh small{display:block;margin-top:2px}
.opt{border-top:1px dashed var(--line);padding-top:8px}.opt summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--b1)}
aside{border-radius:20px;box-shadow:0 4px 18px rgba(30,60,90,.05)}.pj{border-radius:14px}.pj.on{background:#e4f1f4;box-shadow:inset 3px 0 0 var(--b2)}
button.b{border-radius:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static}.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
</style></head><body>
<header><b>NovaGen</b><span class="sub">Générateur de pages NovaTour</span><span class="sub" id="cl" style="font-size:12px;white-space:nowrap"></span><div id="sw"><input id="q" placeholder="🔎 Rechercher un établissement (nom, ville, téléphone…)" autocomplete="off"><div id="qr"></div></div></header>
<div class="app">
 <aside><h3>Établissements</h3><div id="list"></div><button class="b" style="width:100%;margin-top:10px" id="new">+ Nouvel établissement</button></aside>
 <main id="main"></main>
</div>
<div id="modal"><div class="box"><div class="bar"><b id="mt"></b><button class="b o s" id="mr">↻ Rejouer</button><button class="b s" id="mc">Fermer</button></div><div id="mb" style="flex:1;display:flex;min-height:0"></div></div></div>
<script src="vendor/jszip.min.js"></script>
<script src="gen.js"></script>
<script src="modeles.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body></html>
